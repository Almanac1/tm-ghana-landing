{% if article.author or show_date %}
  <div class="article-meta">
    {% if article.author %}<span class="article-meta-author">By {{ article.author }}</span>{% endif %}
    {% if show_date %}
      <span class="article-meta-date">
        {% if article.author %}<span aria-hidden="true">&bull;</span>{% endif %}
        <time datetime="{{ article.publication_date|date:'c' }}">{{ article.publication_date|date:"F j, Y" }}</time>
      </span>
    {% endif %}
  </div>
{% endif %}
